<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professores - SaaS Escolar</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo"><h2>SaaS Escolar</h2></div>
            <ul class="nav-links">
                <li><a href="../index.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="escola.html"><i class="fas fa-school"></i> Escolas</a></li>
                <li><a href="professores.html" class="active"><i class="fas fa-chalkboard-teacher"></i> Professores</a></li>
                <li><a href="alunos.html"><i class="fas fa-user-graduate"></i> Alunos</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="topbar">
                <button id="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <h1>Gestão de Professores</h1>
                <button id="theme-toggle" class="btn"><i class="fas fa-moon"></i></button>
            </header>

            <div class="table-container">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <input type="text" id="busca" class="form-control" placeholder="Buscar por disciplina ou nome..." style="width: 300px;">
                    <button class="btn btn-primary" id="btn-novo"><i class="fas fa-plus"></i> Novo Professor</button>
                </div>

                <table id="tabela-professores">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Disciplina</th>
                            <th>Formação</th>
                            <th>Telefone</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Linhas geradas pelo JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL CADASTRO/EDIÇÃO -->
    <div class="modal-overlay" id="modal-professor">
        <div class="modal">
            <h2 id="modal-titulo">Novo Professor</h2>
            <form id="form-professor">
                <input type="hidden" id="professor-id">
                
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>CPF</label>
                        <input type="text" id="cpf" class="form-control" data-mask="cpf" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Telefone</label>
                        <input type="text" id="telefone" class="form-control" data-mask="telefone" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Acadêmico</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Disciplina</label>
                        <input type="text" id="disciplina" class="form-control" placeholder="Ex: Matemática" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Formação</label>
                        <input type="text" id="formacao" class="form-control" placeholder="Ex: Licenciatura" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn" id="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/professores.js"></script>
</body>
</html>
